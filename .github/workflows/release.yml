name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  packages: write   # push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Check that the tag matches the project version
        run: |
          VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the pom version $VERSION"
            exit 1
          fi

      - name: Build and test
        run: ./mvnw -B verify

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: kawa-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # this version's section of the changelog becomes the release notes
          awk -v heading="## [$VERSION]" 'index($0, "## [") == 1 { printing = (index($0, heading) == 1); next } printing' \
            CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "Kawa $GITHUB_REF_NAME" --notes-file release-notes.md \
            "kawa-server/target/kawa-server-$VERSION.jar" \
            "kawa-client/target/kawa-client-$VERSION.jar"
