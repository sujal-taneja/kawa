services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kawa
      POSTGRES_USER: kawa
      POSTGRES_PASSWORD: kawa
    ports:
      - "5432:5432"
    volumes:
      - kawa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kawa -d kawa"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  kawa-pgdata:
