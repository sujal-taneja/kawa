# docker compose up -d            Kawa + PostgreSQL, Kawa on http://localhost:8080
# docker compose up -d postgres   only the database, for running Kawa from source (see the README)
services:
  kawa:
    build:
      context: .
      dockerfile: kawa-server/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kawa
      SPRING_DATASOURCE_USERNAME: kawa
      SPRING_DATASOURCE_PASSWORD: kawa
    ports:
      - "${KAWA_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kawa
      POSTGRES_USER: kawa
      POSTGRES_PASSWORD: kawa
    ports:
      - "5432:5432"
    volumes:
      - kawa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kawa -d kawa"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  kawa-pgdata:
