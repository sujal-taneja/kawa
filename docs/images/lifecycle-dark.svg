<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350" role="img" aria-label="Kawa job lifecycle"><title>Kawa job lifecycle</title><defs><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker><marker id="arrow-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker><marker id="arrow-done" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-dead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker></defs><circle cx="22" cy="182.0" r="7" fill="#e6edf3"/><path d="M32,182.0 L96,182.0" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#arrow-line)"/><text x="64" y="172.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#9198a1">enqueue</text><path d="M268,182.0 L456,182.0" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#arrow-line)"/><text x="364.0" y="172.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#9198a1">take</text><text x="364.0" y="204.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1">SKIP LOCKED + lease token</text><path d="M544.0,150 C544.0,72 184.0,72 184.0,146" stroke="#4493f8" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-pending)"/><text x="364.0" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#4493f8">nack  ·  lease expired</text><text x="364.0" y="51" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1">attempts left → retry after a delay</text><path d="M628,168 C708,168 700,94.0 786,94.0" stroke="#3fb950" stroke-width="1.6" fill="none" marker-end="url(#arrow-done)"/><text x="720" y="84.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#3fb950">ack</text><path d="M628,196 C708,196 700,270.0 786,270.0" stroke="#f85149" stroke-width="1.6" fill="none" marker-end="url(#arrow-dead)"/><text x="670" y="294.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#f85149">nack  ·  lease expired</text><text x="670" y="312.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1">no attempts left</text><rect x="100" y="150" width="168" height="64" rx="12" fill="#4493f8" fill-opacity="0.16" stroke="#4493f8" stroke-width="1.5"/><text x="184.0" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1" fill="#4493f8">PENDING</text><text x="184.0" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">waiting to run</text><rect x="460" y="150" width="168" height="64" rx="12" fill="#d29922" fill-opacity="0.16" stroke="#d29922" stroke-width="1.5"/><text x="544.0" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1" fill="#d29922">LEASED</text><text x="544.0" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">held by one worker</text><rect x="790" y="62" width="168" height="64" rx="12" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-width="1.5"/><text x="874.0" y="90" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1" fill="#3fb950">DONE</text><text x="874.0" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">finished</text><rect x="790" y="238" width="168" height="64" rx="12" fill="#f85149" fill-opacity="0.16" stroke="#f85149" stroke-width="1.5"/><text x="874.0" y="266" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1" fill="#f85149">DEAD</text><text x="874.0" y="286" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">kept for inspection</text></svg>
