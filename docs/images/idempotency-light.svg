<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Retried enqueues with one idempotency key create one job"><title>Retried enqueues with one idempotency key create one job</title><defs><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="arrow-done" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-dead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs><rect x="20" y="112" width="170" height="76" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="105.0" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1f2328">Your app</text><text x="105.0" y="164" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e">same request, 3 times</text><rect x="480" y="64" width="170" height="172" rx="16" fill="#0e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.8"/><text x="565.0" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0e7490">Kawa</text><text x="565.0" y="122" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#59636e">INSERT … ON CONFLICT</text><text x="565.0" y="138" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#59636e">DO NOTHING</text><path d="M190,96 L474,96" stroke="#8c959f" stroke-width="1.6" fill="none" marker-end="url(#arrow-line)"/><text x="205" y="88" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#1f2328">POST  Idempotency-Key: order-42</text><text x="205" y="113" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#cf222e">← 201 Created, but the response is lost</text><path d="M190,156 L474,156" stroke="#8c959f" stroke-width="1.6" fill="none" marker-end="url(#arrow-line)"/><text x="205" y="148" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#1f2328">retry  (same key, same payload)</text><text x="205" y="173" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1a7f37">← 200 · same job id · Idempotent-Replayed</text><path d="M190,216 L474,216" stroke="#8c959f" stroke-width="1.6" fill="none" marker-end="url(#arrow-line)"/><text x="205" y="208" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#1f2328">retry  (same key, same payload)</text><text x="205" y="233" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1a7f37">← 200 · same job id · Idempotent-Replayed</text><rect x="760" y="98" width="220" height="104" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="776" y="124" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1f2328">jobs</text><rect x="774" y="140" width="192" height="44" rx="9" fill="#1a7f37" fill-opacity="0.1" stroke="#1a7f37" stroke-width="1.3"/><text x="870.0" y="167" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#1a7f37">order-42 → 1 job</text><path d="M650,140 L754,140" stroke="#1a7f37" stroke-width="1.6" fill="none" marker-end="url(#arrow-done)"/><text x="705" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1a7f37">first: inserted</text><path d="M650,172 L754,172" stroke="#8c959f" stroke-width="1.6" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow-line)"/><text x="705" y="192" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#59636e">retries: no-op</text><text x="500.0" y="300" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#59636e">A unique index on (queue, idempotency_key) decides: one job, however many retries</text></svg>
