<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350" role="img" aria-label="Kawa job lifecycle"><title>Kawa job lifecycle</title><defs><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="arrow-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="arrow-done" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-dead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs><circle cx="22" cy="182.0" r="7" fill="#1f2328"/><path d="M32,182.0 L96,182.0" stroke="#8c959f" stroke-width="1.6" fill="none" marker-end="url(#arrow-line)"/><text x="64" y="172.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#59636e">enqueue</text><path d="M268,182.0 L456,182.0" stroke="#8c959f" stroke-width="1.6" fill="none" marker-end="url(#arrow-line)"/><text x="364.0" y="172.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#59636e">take</text><text x="364.0" y="204.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e">SKIP LOCKED + lease token</text><path d="M544.0,150 C544.0,72 184.0,72 184.0,146" stroke="#0969da" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-pending)"/><text x="364.0" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#0969da">nack  ·  lease expired</text><text x="364.0" y="51" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e">attempts left → retry after a delay</text><path d="M628,168 C708,168 700,94.0 786,94.0" stroke="#1a7f37" stroke-width="1.6" fill="none" marker-end="url(#arrow-done)"/><text x="720" y="84.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#1a7f37">ack</text><path d="M628,196 C708,196 700,270.0 786,270.0" stroke="#cf222e" stroke-width="1.6" fill="none" marker-end="url(#arrow-dead)"/><text x="670" y="294.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#cf222e">nack  ·  lease expired</text><text x="670" y="312.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e">no attempts left</text><rect x="100" y="150" width="168" height="64" rx="12" fill="#0969da" fill-opacity="0.1" stroke="#0969da" stroke-width="1.5"/><text x="184.0" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1" fill="#0969da">PENDING</text><text x="184.0" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">waiting to run</text><rect x="460" y="150" width="168" height="64" rx="12" fill="#9a6700" fill-opacity="0.1" stroke="#9a6700" stroke-width="1.5"/><text x="544.0" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1" fill="#9a6700">LEASED</text><text x="544.0" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">held by one worker</text><rect x="790" y="62" width="168" height="64" rx="12" fill="#1a7f37" fill-opacity="0.1" stroke="#1a7f37" stroke-width="1.5"/><text x="874.0" y="90" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1" fill="#1a7f37">DONE</text><text x="874.0" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">finished</text><rect x="790" y="238" width="168" height="64" rx="12" fill="#cf222e" fill-opacity="0.1" stroke="#cf222e" stroke-width="1.5"/><text x="874.0" y="266" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1" fill="#cf222e">DEAD</text><text x="874.0" y="286" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">kept for inspection</text></svg>
