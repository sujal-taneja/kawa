e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.3"/><text x="615" y="210.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0e7490">LEASED · token bbb</text><path d="M760,92 L760,186" stroke="#cf222e" stroke-width="1.6" fill="none" marker-end="url(#arrow-dead)"/><text x="768" y="136" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#cf222e">ack(token aaa)</text><text x="768" y="154" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#cf222e">→ 409 Conflict</text><g stroke="#cf222e" stroke-width="2.4" stroke-linecap="round"><path d="M752,198 L768,214"/><path d="M768,198 L752,214"/></g><path d="M900,320 L900,224" stroke="#1a7f37" stroke-width="1.6" fill="none" marker-end="url(#arrow-done)"/><text x="892" y="274" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#1a7f37">ack(token bbb)</text><rect x="865.0" y="192" width="70" height="28" rx="14" fill="#1a7f37" fill-opacity="0.1" stroke="#1a7f37" stroke-width="1.3"/><text x="900" y="210.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#1a7f37">DONE</text><text x="500.0" y="378" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#59636e">Every claim gets a new token, and only the current token can settle the job</text></svg>
