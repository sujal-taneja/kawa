<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" role="img" aria-label="Two workers claiming jobs without collisions"><title>Two workers claiming jobs without collisions</title><defs><marker id="arrow-leased" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs><text x="490.0" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Two workers call take at the same moment</text><rect x="30" y="66" width="180" height="64" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="120.0" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1f2328">Worker A</text><rect x="30" y="196" width="180" height="64" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="120.0" y="226" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1f2328">Worker B</text><rect x="470" y="64" width="470" height="48" rx="10" fill="#9a6700" fill-opacity="0.1" stroke="#9a6700" stroke-width="1.4"/><text x="492" y="94" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#9a6700">#7</text><text x="536" y="94" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2328">beach.jpg</text><text x="920" y="94" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#9a6700">locked by Worker A</text><rect x="470" y="130" width="470" height="48" rx="10" fill="#0e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.4"/><text x="492" y="160" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0e7490">#8</text><text x="536" y="160" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2328">city.jpg</text><text x="920" y="160" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0e7490">locked by Worker B</text><rect x="470" y="196" width="470" height="48" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="492" y="226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#59636e">#9</text><text x="536" y="226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2328">forest.jpg</text><text x="920" y="226" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#59636e">PENDING: next in line</text><text x="474" y="54" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e">jobs, in the order take looks at them</text><path d="M210,98 L464,88" stroke="#9a6700" stroke-width="1.6" fill="none" marker-end="url(#arrow-leased)"/><text x="330" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#9a6700">locks #7</text><path d="M210,214 L464,104" stroke="#8c959f" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-line)"/><text x="318" y="146" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#59636e">#7 is locked: skip it</text><path d="M210,236 L464,154" stroke="#0e7490" stroke-width="1.6" fill="none" marker-end="url(#arrow-accent)"/><text x="360" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0e7490">locks #8 instead</text><text x="490.0" y="306" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#59636e">FOR UPDATE SKIP LOCKED: each worker gets a different job, and nobody waits</text></svg>
